 ["كرات دجاج محشية", "30"], ["كوردن بلو", "125"], ["كيبة", "30"], ["سمبوسة جبنة", "15"], ["سمبوسة لحمة", "20"]]}, {"title": "وجبات الطلبة", "id": "students", "items": [["مكرونة وايت صوص مع قطعتين استربس", "160"], ["مكرونة ريد صوص مع قطعة فراخ بانيه مقلية", "140"], ["أرز بسمتي مع ربع فرخة مشوية", "140"], ["محشي كرنب مع 2 كفتة فراخ مشوية", "150"], ["محشي ورق عنب مع شريحة مشوي صدور", "160"], ["أرز وملوخية مع ربع فرخة مشوية", "160"]]}, {"title": "وجبات تكفي فردين", "id": "two", "items": [["أرز وملوخية ونص فرخة محمرة", "350"], ["محشي كرنب مع نص بطة", "500"], ["ورقة لحمة بالخضار مع أرز بالشعرية", "600"], ["محشي كرنب وورق عنب وممبار مع كفتة وشيش طاووق ومشوي صدور", "600"], ["أرز بسمتي مع نص فرخة مشوية وكفتة وشيش طاووق", "650"]]}];
let cart=[];
function firstNumber(p){const n=String(p).match(/\d+/g);return n?Number(n[0]):0}
function priceOptions(price){const t=String(price).trim();if(t.includes("حسب"))return[{label:"حسب الوزن",price:t}];const nums=t.split("/").map(x=>x.trim()).filter(Boolean);if(nums.length===1)return[{label:"",price:nums[0]}];return nums.map((n,i)=>({label:i===0?"نصف كيلو":"كيلو",price:n}))}
function renderTabs(){document.getElementById("tabs").innerHTML=sections.map(s=>`<a href="#${s.id}">${s.title}</a>`).join("")}
function itemCard(item){const ops=priceOptions(item[1]);const name=item[0];if(ops.length===1){const chosen={name:name,price:ops[0].price,label:ops[0].label};const data=encodeURIComponent(JSON.stringify(chosen));const txt=String(item[1]).includes("حسب")?item[1]:item[1]+" ج.م";return `<div class="item"><h3>${name}</h3><div class="bottom"><span class="price">${txt}</span><button class="add" onclick="addToCart('${data}',this)">أضيفي للسلة</button></div></div>`}return `<div class="item"><h3>${name}</h3><p class="choose">اختاري الحجم:</p><div class="sizes">${ops.map(o=>{const data=encodeURIComponent(JSON.stringify({name:name,price:o.price,label:o.label}));return `<button class="sizeBtn" onclick="addToCart('${data}',this)">${o.label} — ${o.price} ج.م</button>`}).join("")}</div></div>`}
function renderMenu(){document.getElementById("menu").innerHTML=sections.map(s=>`<article class="section" id="${s.id}"><h2>${s.title}</h2><div class="grid">${s.items.map(itemCard).join("")}</div>${s.note?`<div class="note">${s.note}</div>`:""}</article>`).join("")}
function showToast(txt){const t=document.getElementById("toast");t.textContent=txt;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1300)}
function markBtn(btn){if(!btn)return;const old=btn.textContent;btn.classList.add("added");btn.textContent="اتضاف ✅";setTimeout(()=>{btn.classList.remove("added");btn.textContent=old},900)}
function addToCart(data,btn){const item=JSON.parse(decodeURIComponent(data));const name=item.label?`${item.name} - ${item.label}`:item.name;const key=name+"|"+item.price;const found=cart.find(x=>x.key===key);if(found)found.qty++;else cart.push({key,name,price:item.price,unit:firstNumber(item.price),qty:1});updateCart();markBtn(btn);showToast("اتضاف للسلة ✅")}
function changeQty(key,d){const item=cart.find(x=>x.key===key);if(!item)return;item.qty+=d;if(item.qty<=0)cart=cart.filter(x=>x.key!==key);updateCart()}
function removeItem(key){cart=cart.filter(x=>x.key!==key);updateCart()}
function total(){return cart.reduce((s,i)=>s+i.unit*i.qty,0)}
function updateCart(){const c=cart.reduce((s,i)=>s+i.qty,0);document.getElementById("cartCount").textContent=c;document.getElementById("floatCartCount").textContent=c;document.getElementById("totalPrice").textContent=total();const box=document.getElementById("cartItems");if(cart.length===0){box.innerHTML=`<div class="empty">السلة فاضية حاليًا… اختاري أكلك المفضل وكمّلي الطلب 😍</div>`;return}box.innerHTML=cart.map(i=>`<div class="cartRow"><div><div class="cartName">${i.name}</div><div class="price">${String(i.price).includes("حسب")?i.price:i.price+" ج.م"}</div></div><div class="qty"><button onclick="changeQty('${i.key}',1)">+</button><span>${i.qty}</span><button onclick="changeQty('${i.key}',-1)">−</button></div><button class="remove" onclick="removeItem('${i.key}')">حذف</button></div>`).join("")}
function openCart(){document.getElementById("cartModal").classList.add("active");updateCart()}
function closeCart(){document.getElementById("cartModal").classList.remove("active")}
function sendOrder(){const name=document.getElementById("customerName").value.trim();const phone=document.getElementById("customerPhone").value.trim();const address=document.getElementById("customerAddress").value.trim();const note=document.getElementById("customerNote").value.trim();if(!cart.length){alert("السلة فاضية، اختاري صنف الأول.");return}if(!name){alert("من فضلك اكتبي الاسم.");return}if(!phone){alert("من فضلك اكتبي رقم الموبايل.");return}if(!address){alert("من فضلك اكتبي العنوان بالتفصيل.");return}const lines=cart.map(i=>`• ${i.name} × ${i.qty} — ${i.unit*i.qty} ج.م`).join("\n");const noteLine=note?`\n📝 *ملاحظات:* ${note}`:"";const msg=`🍽️ *طلب جديد من Walaa food* 🍽️\n\n👤 *الاسم:* ${name}\n📞 *رقم الموبايل:* ${phone}\n📍 *العنوان:* ${address}${noteLine}\n───────────────\n\n🧾 *تفاصيل الطلب:*\n${lines}\n\n───────────────\n💰 *إجمالي الطلب:* ${total()} ج.م\n\nشكرًا لاختيارك Walaa food 🤍\nفي انتظار تأكيد الأوردر ✨`;window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank")}
document.getElementById("cartModal").addEventListener("click",e=>{if(e.target.id==="cartModal")closeCart()});
renderTabs();renderMenu();updateCart();
</script></body></html>
