let cart=[];
function firstNumber(p){const n=String(p).match(/\d+/g);return n?Number(n[0]):0}
function priceOptions(price){const t=String(price).trim();if(t.includes("حسب"))return[{label:"حسب الوزن",price:t}];const nums=t.split("/").map(x=>x.trim()).filter(Boolean);if(nums.length===1)return[{label:"",price:nums[0]}];let labels=nums.length===2?["نصف","كامل"]:nums.length===3?["ربع كيلو","نصف كيلو","كيلو"]:nums.map((_,i)=>"اختيار "+(i+1));return nums.map((n,i)=>({label:labels[i],price:n}))}
function renderTabs(){document.getElementById("tabs").innerHTML=sections.map(s=>`<a href="#${s.id}">${s.title}</a>`).join("")}
function itemCard(item){const ops=priceOptions(item.price);if(ops.length===1){const chosen={name:item.name,desc:item.desc||"",price:ops[0].price,label:ops[0].label};const data=encodeURIComponent(JSON.stringify(chosen));const txt=String(item.price).includes("حسب")?item.price:item.price+" ج.م";return `<div class="item"><h3>${item.name}</h3>${item.desc?`<p class="desc">${item.desc}</p>`:""}<div class="bottom"><span class="price">${txt}</span><button class="add" onclick="addToCart('${data}')">أضيفي للسلة</button></div></div>`}return `<div class="item"><h3>${item.name}</h3>${item.desc?`<p class="desc">${item.desc}</p>`:""}<p class="desc">اختاري الحجم المناسب:</p><div class="sizes">${ops.map(o=>{const chosen={name:item.name,desc:item.desc||"",price:o.price,label:o.label};const data=encodeURIComponent(JSON.stringify(chosen));return `<button class="sizeBtn" onclick="addToCart('${data}')">${o.label} — ${o.price} ج.م</button>`}).join("")}</div></div>`}
function renderMenu(){document.getElementById("menu").innerHTML=sections.map(s=>`<article class="section" id="${s.id}"><h2>${s.title}</h2>${s.groups.map(g=>`${g.title?`<div class="groupTitle">${g.title}</div>`:""}<div class="grid">${g.items.map(itemCard).join("")}</div>${g.note?`<div class="note">${g.note}</div>`:""}`).join("")}</article>`).join("")}
function addToCart(data){const item=JSON.parse(decodeURIComponent(data));const name=item.label?`${item.name} - ${item.label}`:item.name;const key=name+"|"+item.price;const found=cart.find(x=>x.key===key);if(found)found.qty++;else cart.push({key,name,desc:item.desc||"",price:item.price,unit:firstNumber(item.price),qty:1});updateCart();openCart()}
function changeQty(key,d){const item=cart.find(x=>x.key===key);if(!item)return;item.qty+=d;if(item.qty<=0)cart=cart.filter(x=>x.key!==key);updateCart()}
function removeItem(key){cart=cart.filter(x=>x.key!==key);updateCart()}
function total(){return cart.reduce((s,i)=>s+i.unit*i.qty,0)}
function updateCart(){const c=cart.reduce((s,i)=>s+i.qty,0);document.getElementById("cartCount").textContent=c;document.getElementById("floatCartCount").textContent=c;document.getElementById("totalPrice").textContent=total();const box=document.getElementById("cartItems");if(cart.length===0){box.innerHTML=`<div class="empty">السلة فاضية حاليًا… اختاري أكلك المفضل وكمّلي الطلب 😍</div>`;return}box.innerHTML=cart.map(i=>`<div class="cartRow"><div><div class="cartName">${i.name}</div>${i.desc?`<p class="desc">${i.desc}</p>`:""}<div class="price">${String(i.price).includes("حسب")?i.price:i.price+" ج.م"}</div></div><div class="qty"><button onclick="changeQty('${i.key}',1)">+</button><span>${i.qty}</span><button onclick="changeQty('${i.key}',-1)">−</button></div><button class="remove" onclick="removeItem('${i.key}')">حذف</button></div>`).join("")}
function openCart(){document.getElementById("cartModal").classList.add("active");updateCart()}
function closeCart(){document.getElementById("cartModal").classList.remove("active")}
function sendOrder(){const name=document.getElementById("customerName").value.trim();const address=document.getElementById("customerAddress").value.trim();if(!cart.length){alert("السلة فاضية، اختاري صنف الأول.");return}if(!name){alert("من فضلك اكتبي الاسم.");return}if(!address){alert("من فضلك اكتبي العنوان بالتفصيل.");return}const lines=cart.map(i=>`• ${i.name} × ${i.qty} — ${i.unit*i.qty} ج.م`).join("\n");const msg=`🍽️ *طلب جديد من Walaa food* 🍽️\n\n👤 *الاسم:* ${name}\n📍 *العنوان:* ${address}\n───────────────\n\n🧾 *تفاصيل الطلب:*\n${lines}\n\n───────────────\n💰 *إجمالي الطلب:* ${total()} ج.م\n\nشكرًا لاختيارك Walaa food 🤍\nفي انتظار تأكيد الأوردر ✨`;window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank")}
document.getElementById("cartModal").addEventListener("click",e=>{if(e.target.id==="cartModal")closeCart()});
